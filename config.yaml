# ZPDS Prepared Segment 配置
# 墨现 Guida Ego 默认阈值

# ---- 视频质量检测 ----
video:
  black_threshold: 5          # 黑屏灰度阈值 (0-255)，向下兼容旧代码
  min_black_duration_s: 0.5   # 连续黑屏超过此秒数才裁切，向下兼容
  # 新版黑屏检测参数
  black_detection:
    mean_intensity_threshold: 5.0    # 灰度均值低于此值视为黑屏
    min_duration_s: 0.5              # 连续黑屏最短持续时长
    edge_tolerance_s: 1.0            # 距首尾距离在此之内视为边缘 trim

# ---- 时间戳异常检测 ----
timestamp:
  video_gap_factor: 2.0       # 帧间隔超过 normal* N 倍视为缺口，向下兼容
  imu_gap_factor: 3.0         # IMU 间隔超过 normal* N 倍视为缺口，向下兼容
  # 新版分级阈值
  video:
    gap_factor: 2.0                 # 视频帧间隔倍数阈值
    split_gap_s: 0.5                # 缺口超过此秒数建议切分
  imu:
    gap_factor: 3.0                 # IMU 采样间隔倍数阈值
    split_gap_s: 1.0                # 缺口超过此秒数建议切分或隔离

# ---- 输出 ----
output:
  target_fps: 30.0            # 输出 CFR 帧率
  rgb_codec: "avc1"           # H.264 fourcc (fallback: mp4v)
  rgb_pix_fmt: "yuv420p"      # 兼容性像素格式（OpenCV 尽力）

# ---- Guida 深度 ----
guida:
  depth:
    enabled: true              # 自动发现 meta 声明、depth_*.mkv 或 depth/*.png
    required: true             # Guida 正式 Prepared 必须包含深度；缺失时明确失败
    output_format: "png_sequence"
    preserve_source_rate: true

# ---- Dunjia 深度 ----
dunjia:
  depth:
    enabled: true              # 从 MCAP CompressedImage Topic 读取内嵌 PNG
    required: true             # 正式 Prepared 必须包含深度流
    output_format: "png_sequence"
    preserve_source_rate: true # 保留源约 25 Hz，不插帧到 RGB 目标帧率
    coverage_tolerance_s: 0.08 # 超过约 2 个源帧周期才视为边界缺失

# ---- 手部检测 ----
hands:
  # 阶段一已冻结路由配置；现有 run_hands CLI 将在后续编排阶段接入该路由。
  ego_bbox_backend: wilor
  non_ego_bbox_backend: mediapipe
  fallback_2d_backend: mediapipe

  mediapipe:
    backend: tasks_hand_landmarker      # auto / tasks_hand_landmarker / solutions_hands
    fallback_backend: solutions_hands
    num_hands: 2
    min_hand_detection_confidence: 0.5
    min_hand_presence_confidence: 0.5
    min_tracking_confidence: 0.5
    bbox_padding_ratio: 0.10

    # Tasks API 后端（新版，需 .task 模型文件）
    tasks:
      model_path: models/mediapipe/hand_landmarker.task
      delegate: cpu                   # cpu / gpu

    # Solutions 经典后端（兼容性好，不需额外模型文件）
    solutions:
      model_complexity: 1             # 0=轻量, 1=完整
      input_mirrored: false           # 非自拍画面设为 false

  # WiLoR 在主进程内加载（wilor_backend 将源码目录插入 sys.path 并 chdir 到
  # WiLoR 源码目录以解析 ./mano_data/ 相对路径，加载后恢复 cwd）；
  # torch/ultralytics 等依赖由独立 Python 环境 wilor_env 提供。
  # 模型仓库 revision、权重名称和哈希已冻结。
  wilor:
    enabled: true
    # 抽帧：false 时每 bbox_fps 时间窗推理一次，中间帧复用上一推理帧结果
    #（耗时大头是 ViT+MANO ~113ms/帧，抽帧按窗口省掉中间帧的 MANO 推理；
    #  YOLO 仅 1-3ms/帧，省它没有意义）。30fps 源 bbox_fps=10 → 每 3 帧推理 1 次。
    ego_bbox_every_frame: false
    bbox_fps: 10.0
    write_frame_status: true
    upstream_repository: https://github.com/rolpotamias/WiLoR.git
    upstream_commit: fcb911312a38fa8badd30d9656a167485d61b8f9
    model_revision: dcf093e9c3e82a63e1a61c851dc20cb4612ccb5f
    source_path: models/wilor/source
    model_version: wilor_cvpr2025
    upstream_license_checked: true
    detector_path: models/wilor/detector.pt
    checkpoint_path: models/wilor/wilor_final.ckpt
    checkpoint_sha256: 3e97aafc7dd08d883a4cc5a027df61fdb6fda6136dbd1319405413862ada6bb2
    model_config_path: models/wilor/model_config.yaml
    mano_model_path: models/wilor/mano_data/mano/MANO_RIGHT.pkl
    mano_mean_params_path: models/wilor/mano_data/mano_mean_params.npz
    asset_manifest_path: models/wilor/download_manifest.json
    device: cuda:0
    precision: fp16
    bbox_padding_ratio: 0.15
    candidate_context_s: 0.75
    require_joint_mapping_version: wilor-to-hands-v1-v1
    require_calibration_for_metric_3d: true

# ---- Segment 约束 ----
segment:
  min_duration_s: 1.0         # 最小 segment 时长
  max_duration_s: 120.0       # 最大 segment 时长

# ---- 前端预览压缩 ----
# 为清洗结果中的每个 MP4 生成 <stream_id>_preview.mp4（保留原视频）。
preview:
  enabled: true
  max_width: 1280             # 超过此宽度时缩放，不足则保持原分辨率（不放大）
  crf: 28                     # H.264 CRF，越大越小
  preset: veryfast
