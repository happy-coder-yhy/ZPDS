# Jianzhi UMI (简智新创) — QC 阈值
profile: jianzhi_umi

scene:
  governance:
    calibration_status: provisional
    soft_boundary_action: quarantine
    auto_finalize_soft_boundaries: false
  stage_a:
    weights:
      histogram: 0.20
      ssim: 0.30
      optical_flow: 0.35
      brightness: 0.15
    histogram:
      threshold: 0.52
    ssim:
      hard_cut_similarity: 0.40
      gradual_similarity: 0.78
    optical_flow:
      residual_threshold_px: 2.40
      residual_hard_scale_px: 7.00
      freeze_motion_threshold_px: 0.12
    brightness:
      mean_jump_threshold: 0.25
  stage_b:
    z_score_threshold: 2.0
  fusion:
    min_scene_duration_s: 3.0
    hysteresis_frames: 2
    same_scene_similarity: 0.95
    low_confidence_threshold: 0.60
# Stage 0: 隐私脱敏适用性
privacy:
  face:
    applicability: not_applicable  # 双端夹爪相机
  text:
    applicability: applicable      # 画面可能含标签/文档

stage2_time:
  max_gap_ms: 50

stage3_visual:
  black_threshold: 5
  overexposure_ratio: 0.95

  # D13 过曝检测
  overexposure:
    enabled: true
    mean_threshold: 220
    overexposure_ratio: 0.95
    saturated_ratio: 0.30
    p95_threshold: 245
    p99_threshold: 250
    consecutive_min: 3
    sample_interval: 1

  # D14 模糊检测
  blur:
    enabled: true
    laplacian_threshold: 150.0    # 1600×1300
    consecutive_min: 3
    sample_interval: 1
    quarantine_duration_s: 1.0  # 模糊段切分时长阈值(s)，仅 blur_split_enabled 时生效
    blur_split_enabled: false   # 默认不切分（保护动作完整性）；true 时长≥阈值才 split

stage5_depth:
  # D15 深度有效性（UMI 无深度流，默认禁用）
  enabled: false
  zero_ratio_max: 0.50
  invalid_ratio_max: 0.60
  valid_ratio_min: 0.40
  frozen_consecutive_min: 3
  rgb_depth_pairing:
    max_offset_ns: 50000000

stage6_imu:
  max_gap_s: 0.03
  sample_rate_hz: 200
  # D16 IMU 异常
  interval:
    expected_interval_s: 0.005   # ~200 Hz (robot0) / ~193 Hz (robot1)
    gap_factor: 3.0
  spike:
    enabled: true
    std_factor: 6.0
  freeze:
    enabled: true
    consecutive_min: 10
  static_bias:
    enabled: true
    static_window_s: 1.0

stage7_robot:
  joint_limit_margin: 0.01   # 关节限位裕度 (rad)

stage11_dedup:
  # D18 近重复检测
  exact_hash:
    enabled: true
    algorithm: sha256
  phash:
    enabled: true
    hamming_max: 10
    sample_count: 10
  trajectory:
    enabled: false               # UMI 无机器人轨迹
    correlation_min: 0.95
    n_bins: 20
