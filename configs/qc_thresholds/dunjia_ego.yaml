# Dunjia Ego (遁甲) — QC 阈值
profile: dunjia_ego

scene:
  governance:
    calibration_status: provisional
    soft_boundary_action: quarantine
    auto_finalize_soft_boundaries: false
  stage_a:
    weights:
      histogram: 0.20
      ssim: 0.30
      optical_flow: 0.35
      brightness: 0.15
    histogram:
      threshold: 0.50
    ssim:
      hard_cut_similarity: 0.40
      gradual_similarity: 0.78
    optical_flow:
      residual_threshold_px: 2.20
      residual_hard_scale_px: 7.00
      freeze_motion_threshold_px: 0.10
    brightness:
      mean_jump_threshold: 0.25
  stage_b:
    z_score_threshold: 2.0
  fusion:
    min_scene_duration_s: 3.0
    hysteresis_frames: 2
    same_scene_similarity: 0.95
    low_confidence_threshold: 0.60
# Stage 0: 隐私脱敏适用性
privacy:
  face:
    applicability: not_applicable  # 夹爪相机，面向操作台
  text:
    applicability: applicable      # 画面可能含标签/文档

stage2_time:
  max_gap_ms: 50

stage3_visual:
  black_threshold: 5
  overexposure_ratio: 0.95

  # D13 过曝检测
  overexposure:
    enabled: true
    mean_threshold: 220
    overexposure_ratio: 0.95
    saturated_ratio: 0.30
    p95_threshold: 245
    p99_threshold: 250
    consecutive_min: 3
    sample_interval: 1

  # D14 模糊检测
  blur:
    enabled: true
    # 多分辨率自适应（见 stage3_visual.BLUR_THRESHOLD_BY_RESOLUTION）
    laplacian_threshold: null    # null = auto-select by resolution
    consecutive_min: 3
    sample_interval: 1

stage4_video_timing:
  vfr_tolerance: 0.01

stage5_depth:
  # D15 深度有效性
  zero_ratio_max: 0.55           # 遁甲深度有较多无效区域
  invalid_ratio_max: 0.65
  valid_ratio_min: 0.35
  frozen_consecutive_min: 3
  rgb_depth_pairing:
    max_offset_ns: 50000000      # 50ms

stage6_imu:
  max_gap_s: 0.03
  sample_rate_hz: 196
  # D16 IMU 异常
  interval:
    expected_interval_s: 0.0051  # ~196 Hz
    gap_factor: 3.0
  spike:
    enabled: true
    std_factor: 6.0
  freeze:
    enabled: true
    consecutive_min: 10
  static_bias:
    enabled: true
    static_window_s: 1.0

stage11_dedup:
  # D18 近重复检测
  exact_hash:
    enabled: true
    algorithm: sha256
  phash:
    enabled: true
    hamming_max: 10
    sample_count: 10
  trajectory:
    enabled: false               # Dunjia 无机器人轨迹
    correlation_min: 0.95
    n_bins: 20
