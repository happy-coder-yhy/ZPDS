# EPIC-KITCHENS-100 — QC 阈值
profile: epic100

scene:
  governance:
    calibration_status: provisional
    soft_boundary_action: quarantine
    auto_finalize_soft_boundaries: false
  stage_a:
    weights:
      histogram: 0.30
      ssim: 0.35
      optical_flow: 0.20
      brightness: 0.15
    histogram:
      threshold: 0.38
    ssim:
      hard_cut_similarity: 0.52
      gradual_similarity: 0.86
    optical_flow:
      residual_threshold_px: 1.60
      residual_hard_scale_px: 5.50
      freeze_motion_threshold_px: 0.06
    brightness:
      mean_jump_threshold: 0.20
  stage_b:
    z_score_threshold: 1.8
  fusion:
    min_scene_duration_s: 3.0
    hysteresis_frames: 2
    same_scene_similarity: 0.95
    low_confidence_threshold: 0.60
# Stage 0: 隐私脱敏适用性
privacy:
  face:
    applicability: unavailable      # 原视频未取回
  text:
    applicability: unavailable      # 原视频未取回

stage1_structure:
  check_pkl_integrity: true

stage3_visual:
  # D13 过曝检测
  overexposure:
    enabled: true
    mean_threshold: 230             # EPIC 厨房场景可能较亮
    overexposure_ratio: 0.90
    saturated_ratio: 0.30
    p95_threshold: 248
    p99_threshold: 252
    consecutive_min: 3
    sample_interval: 1

  # D14 模糊检测
  blur:
    enabled: true
    laplacian_threshold: 100.0
    consecutive_min: 3
    sample_interval: 1

stage5_depth:
  # EPIC 无深度流
  enabled: false

stage6_imu:
  # EPIC 无 IMU
  enabled: false

stage10_semantic:
  vlm_model: "claude-sonnet-5"

stage11_dedup:
  # D18 近重复检测
  exact_hash:
    enabled: true
    algorithm: sha256
  phash:
    enabled: true
    hamming_max: 8                  # EPIC 同类厨房场景，更严格
    sample_count: 10
  trajectory:
    enabled: false                  # EPIC 无机器人轨迹
    correlation_min: 0.95
    n_bins: 20
