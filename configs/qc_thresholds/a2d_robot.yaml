# A2D Robot (真机) — QC 阈值
profile: a2d_robot

scene:
  governance:
    calibration_status: provisional
    soft_boundary_action: quarantine
    auto_finalize_soft_boundaries: false
  stage_a:
    weights:
      histogram: 0.25
      ssim: 0.30
      optical_flow: 0.30
      brightness: 0.15
    histogram:
      threshold: 0.40
    ssim:
      hard_cut_similarity: 0.50
      gradual_similarity: 0.85
    optical_flow:
      residual_threshold_px: 1.40
      residual_hard_scale_px: 5.00
      freeze_motion_threshold_px: 0.05
    brightness:
      mean_jump_threshold: 0.18
  stage_b:
    z_score_threshold: 2.0
  fusion:
    min_scene_duration_s: 3.0
    hysteresis_frames: 2
    same_scene_similarity: 0.95
    low_confidence_threshold: 0.60
# Stage 0: 隐私脱敏适用性
privacy:
  face:
    applicability: not_applicable  # 机器人相机
  text:
    applicability: applicable      # 画面可能含屏幕/标签

stage2_time:
  max_gap_ms: 100

stage3_visual:
  black_threshold: 5
  overexposure_ratio: 0.95

  # D13 过曝检测
  overexposure:
    enabled: true
    mean_threshold: 220
    overexposure_ratio: 0.95
    saturated_ratio: 0.30
    p95_threshold: 245
    p99_threshold: 250
    consecutive_min: 3
    sample_interval: 1

  # D14 模糊检测
  blur:
    enabled: true
    laplacian_threshold: 30.0     # 640×480
    consecutive_min: 3
    sample_interval: 1
    quarantine_duration_s: 1.0  # 模糊段达此时长(s) → split 切分；更短 → keep_with_flag 打标

stage5_depth:
  # D15 深度有效性
  zero_ratio_max: 0.40            # A2D hand 相机深度零值比 20-36%
  invalid_ratio_max: 0.50
  valid_ratio_min: 0.50
  frozen_consecutive_min: 3
  rgb_depth_pairing:
    max_offset_ns: 50000000       # 50ms

stage6_imu:
  # A2D 无 IMU
  enabled: false

stage7_robot:
  joint_limit_margin: 0.05
  command_timeout_ms: 500

stage8_calibration:
  reprojection_error_max: 2.0     # 最大重投影误差 (px)

stage11_dedup:
  # D18 近重复检测
  exact_hash:
    enabled: true
    algorithm: sha256
  phash:
    enabled: true
    hamming_max: 10
    sample_count: 10
  trajectory:
    enabled: true                  # A2D 有机器人关节轨迹
    correlation_min: 0.95
    n_bins: 20
