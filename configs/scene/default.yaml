scene:
  # 默认关闭场景分割 + VLM 复核（主流程 --with-scene 也要求此处为 true 才会执行）。
  # 需要启用时改为 true，再以 --with-scene 运行。
  enabled: false
  output_dir: ../../output/scene

  governance:
    calibration_status: provisional
    soft_boundary_action: quarantine
    auto_finalize_soft_boundaries: false

  stage_a:
    smoothing_window_frames: 5
    merge_window_s: 0.5
    weights:
      histogram: 0.25
      ssim: 0.30
      optical_flow: 0.30
      brightness: 0.15

    histogram:
      enabled: true
      h_bins: 32
      s_bins: 32
      method: bhattacharyya
      threshold: 0.45

    ssim:
      enabled: true
      gaussian_window_size: 11
      gaussian_sigma: 1.5
      hard_cut_similarity: 0.45
      gradual_similarity: 0.82
      gradual_window_frames: 5
      gradual_min_frames: 3

    optical_flow:
      enabled: true
      # 光流按比例缩小到最长边 320px，输出位移仍换算为原图像素。
      analysis_max_dimension: 320
      pyr_scale: 0.5
      levels: 3
      window_size: 15
      iterations: 3
      poly_n: 5
      poly_sigma: 1.2
      grid_step: 8
      min_correspondences: 16
      ransac_reproj_threshold: 2.0
      residual_threshold_px: 1.8
      residual_hard_scale_px: 6.0
      freeze_motion_threshold_px: 0.08
      freeze_min_frames: 5

    brightness:
      enabled: true
      mean_jump_threshold: 0.22
      black_pixel_value: 16
      black_ratio_threshold: 0.95

  stage_b:
    enabled: true
    model: facebook/dinov2-small
    sample_fps: 1.0
    candidate_context_s: 2.0
    z_score_window: 30
    z_score_threshold: 2.0
    # ±2 秒、1 FPS 的单候选窗口只有 5 帧，至少 3 个邻居即可计算局部 z-score。
    min_z_score_samples: 3
    batch_size: 8
    device: cpu

  fusion:
    min_scene_duration_s: 3.0
    hysteresis_frames: 2
    same_scene_similarity: 0.95
    low_confidence_threshold: 0.6

  vlm:
    enabled: true
    # OpenAI 兼容端点；空则回退到阿里云百炼兼容模式。
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    # 空则从环境变量 VLM_MODEL 读取（vlm 模型名已写入 .env）。
    model: ""
    api_key_env: DASHSCOPE_API_KEY
    # 相对路径按配置文件所在目录解析（与 output_dir 约定一致）。
    labels_path: labels.yaml
    timeout_s: 60.0
    review_confidence_threshold: 0.6
